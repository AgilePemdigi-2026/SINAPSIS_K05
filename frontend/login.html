<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SINAPSIS - Login</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <style>
    body { background: #f1f1ee; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      background: #fff; border: 1px solid #dcdcd6; border-radius: 10px;
      padding: 40px 36px; width: 100%; max-width: 440px; box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .login-card h1 {
      text-align: center; font-size: 18px; font-weight: 800; color: #b3112b;
      letter-spacing: .5px; margin: 0 0 4px;
    }
    .login-card .subtitle {
      text-align: center; font-size: 14px; color: #667085; margin: 0 0 28px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #1f2328; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #dcdcd6;
      border-radius: 6px; background: #f6f6f3; color: #1f2328; outline: none;
    }
    .form-group input:focus { border-color: #b3112b; background: #fff; }
    .btn-login {
      width: 100%; padding: 12px; font: inherit; font-weight: 700; font-size: 15px;
      background: #b3112b; color: #fff; border: 0; border-radius: 6px; cursor: pointer;
      margin-top: 6px;
    }
    .btn-login:hover { background: #8c0d22; }
    .btn-login:disabled { opacity: .6; cursor: wait; }
    .error-area {
      margin-top: 14px; padding: 10px 14px; background: #fdf1f3; border: 1px solid #e7b3bc;
      border-radius: 6px; color: #b3112b; font-size: 13px; font-weight: 600; text-align: center;
    }
    .error-area[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>SINAPSIS - SISTEM MANAJEMEN LAMPU LALU LINTAS CERDAS</h1>
    <p class="subtitle">LOGIN ADMINISTRATOR / PETUGAS</p>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password">
      </div>
      <button type="submit" id="btnLogin" class="btn-login">Login</button>
    </form>

    <div id="errorArea" class="error-area" hidden></div>
  </div>

  <script>
  (function () {
    'use strict';

    var form = document.getElementById('loginForm');
    var btnLogin = document.getElementById('btnLogin');
    var errorArea = document.getElementById('errorArea');

    function showError(msg) {
      errorArea.textContent = msg;
      errorArea.hidden = !msg;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      showError('');

      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      // Client-side check (also validated server-side)
      if (!username.trim() || !password) {
        showError('Login gagal. Semua field harus diisi!');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Memproses...';

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      })
      .then(function (res) {
        return res.json().then(function (body) {
          return { ok: res.ok, status: res.status, body: body };
        });
      })
      .then(function (r) {
        if (!r.ok) {
          showError(r.body.detail || 'Terjadi kesalahan.');
          return;
        }

        // Simpan token & data user
        localStorage.setItem('access_token', r.body.access_token);
        localStorage.setItem('user_role', r.body.user.role);
        localStorage.setItem('user_nama', r.body.user.nama);
        localStorage.setItem('user_username', r.body.user.username);
        localStorage.setItem('user_menu', JSON.stringify(r.body.menu));

        // Tampilkan pesan sukses
        showError('');
        errorArea.hidden = false;
        errorArea.style.background = '#e8f3ec';
        errorArea.style.borderColor = '#b9dcc4';
        errorArea.style.color = '#2f7d4a';
        errorArea.textContent = r.body.pesan; // "Login Berhasil!"

        // Redirect ke dashboard setelah 800ms
        setTimeout(function () {
          window.location.href = r.body.redirect || '/dashboard';
        }, 800);
      })
      .catch(function (err) {
        showError('Gagal terhubung ke server: ' + err.message);
      })
      .finally(function () {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Login';
      });
    });
  })();
  </script>
</body>
</html>
